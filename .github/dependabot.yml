# Dependabot version + security updates, grouped per ecosystem.
# One PR per ecosystem per update-type instead of one PR per package.
version: 2
updates:
- package-ecosystem: pip
  directory: /plugins/runway/examples/hooks
  schedule:
    interval: monthly
    time: "09:00"
    timezone: America/Los_Angeles
  labels:
  - dependencies
  groups:
    pip-version:
      applies-to: version-updates
      patterns:
      - '*'
    pip-security:
      applies-to: security-updates
      patterns:
      - '*'
