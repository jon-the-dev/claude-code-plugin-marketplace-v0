schema_version: "1.1"
name: alb-only-limits
expected_outcome: |
  Correctly states that ALB listener header modification can set
  Strict-Transport-Security, Content-Security-Policy, X-Content-Type-Options,
  X-Frame-Options and suppress the Server header, but cannot set
  Referrer-Policy or Permissions-Policy, so an ALB-only change cannot reach
  A+. Notes the existing HSTS max-age=3600 is too short and that the ALB
  value will overwrite it. Adds routing_http_response_* attributes to the
  HTTPS listener in terraform (not the HTTP redirect listener). Identifies
  the minimal app-side change: Permissions-Policy (and optionally a stronger
  Referrer-Policy) via Django settings/middleware, and flags the
  gunicorn/20.1.0 Server leak. Recommends CSP in Report-Only first for a
  Django app. plan.md written.
context:
  scaffold_script: place-files.sh
